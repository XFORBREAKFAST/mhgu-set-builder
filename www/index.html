 MODE=m;DB=DBS[m];G.last=m;saveG();

function setTheme(m){document.documentElement.dataset.mode=m||'';const c={gu:'#0b0f17',u4:'#130c0e'}[m]||'#0c0e13';document.querySelector('meta[name=theme-color]').content=c}

let AC=null;
function sfx(t){if(G.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
 const now=AC.currentTime,P={tap:[[880,1320,.045,.07]],pop:[[520,980,.07,.09]],up:[[660,0,.06,.08],[990,0,.09,.08,.07]],down:[[620,0,.06,.07],[420,0,.1,.07,.06]],chime:[[784,0,.18,.08],[1175,0,.28,.07,.11]],whoosh:[[300,900,.22,.06]],open:[[440,660,.12,.06]]}[t]||[];
 P.forEach(([f,f2,d,v,dl=0])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f,now+dl);if(f2)o.frequency.exponentialRampToValueAtTime(f2,now+dl+d);
  g.gain.setValueAtTime(0,now+dl);g.gain.linearRampToValueAtTime(v,now+dl+.008);g.gain.exponentialRampToValueAtTime(.0001,now+dl+d);o.connect(g).connect(AC.destination);o.start(now+dl);o.stop(now+dl+d+.02)})}catch(e){}}

<section class=card><div class=ch><span class=n>${ic('star')}</span><h3>Rank armor</h3><span class=x>${['Semua rank','Low Rank','High Rank','G Rank'][S.rank]}</span></div>${pills('rank',[[1,'Low'],[2,'High'],[3,'G'],[0,'Semua']])}</section>

<button class=add onclick="openSheet()">${ic('plus')}Tambah skill</button></section>

${[['none','none','Tanpa talisman','Cari hanya dari armor & decoration'],['all','stack','Semua talismanku',S.charms.length?S.charms.length+' talisman tersimpan':'Belum ada talisman tersimpan']].concat(S.charms.map((c,i)=>[String(i),'charm',cs(c),c.s?c.s+' slot':'Tanpa slot'])).map(o=>`<button class="opt ${String(S.charm)==o[0]?'on':''}" onclick="st('charm','${o[0]}')"><span class=ic>${ic(o[1])}</span><div><b>${o[2]}</b><small>${o[3]}</small></div><span class=rd>${String(S.charm)==o[0]?ic('check'):''}</span></button>`).join('')}</section>`;

function vCharm(){
 $('#cta').innerHTML='';
 const sel=(id,v,opt)=>`<select onchange="draft.${id}=+this.value;vCharm()">${opt?'<option value=-1>— Tidak ada —</option>':'<option value=-1>Pilih skill…</option>'}${ABL.map(x=>`<option value=${x[1]} ${v==x[1]?'selected':''}>${x[0]}</option>`).join('')}</select>`;
 const num=k=>`<div class=num><button onclick="draft.${k}--;vCharm()">−</button><span>${sgn(draft[k])}</span><button onclick="draft.${k}++;vCharm()">+</button></div>`;
 $('#app').innerHTML=`<header class=top><div class=logo>${ic('charm')}</div><div><h1>Talisman</h1><p>${MI[MODE][0]} · simpan talisman kamu</p></div>${hdrBtns()}</header>
<section class=card><div class=ch><span class=n>${ic('plus')}</span><h3>Tambah talisman</h3></div>
<div class=lbl style="margin-top:0">Skill 1</div><div class=field>${sel('a1',draft.a1)}${num('p1')}</div>
<div class=lbl>Skill 2 (opsional)</div><div class=field>${sel('a2',draft.a2,1)}${draft.a2>=0?num('p2'):''}</div>
<div class=lbl>Slot</div><div class=pills>${[0,1,2,3].map(i=>`<button class="${draft.s==i?'on':''}" onclick="draft.s=${i};vCharm()">${i?dots(i,3):'0'}</button>`).join('')}</div>
<button class=save onclick="addC()">${ic('check')}Simpan talisman</button></section>
<section class=card><div class=ch><span class=n>${ic('stack')}</span><h3>Talismanku</h3><span class=x>${S.charms.length}</span></div>
${S.charms.map((c,i)=>`<div class=cm><span class=ic>${ic('charm')}</span><div><b>${cs(c)}</b><small>${c.s?dots(c.s,3):'Tanpa slot'}</small></div><button class=del onclick="delC(${i})" aria-label="Hapus">${ic('trash')}</button></div>`).join('')||`<p class=empty>${ic('charm')}Belum ada talisman. Ini opsional.</p>`}</section>`}
function rm(a){delete S.need[a];LAST=null;save();sfx('down');view()}
function openSheet(){$('#q').value='';ftag=-1;slist();$('#sl').scrollTop=0;$('#sheet').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open')}
function slist(){
 const q=$('#q').value.toLowerCase();
 $('#tg').innerHTML=[[-1,'Semua']].concat(TAGS.map((t,i)=>[i,t])).map(t=>`<button class="${ftag==t[0]?'on':''}" onclick="ftag=${t[0]};slist()">${t[1]}</button>`).join('');
 $('#sl').innerHTML=SK.filter(s=>(ftag<0||(DB.tg[s.a]||[]).includes(ftag))&&(!q||(s.n+' '+DB.ab[s.a]).toLowerCase().includes(q))).slice(0,120).map(s=>{const on=S.need[s.a]==s.i;return`<div class="it ${on?'on':''}" onclick="pick(${s.i})"><span class=ic>${ic(on?'check':'skill')}</span><div><b>${s.n}</b><em>${s.p}pt · ${DB.ab[s.a]}</em><p>${s.d}</p></div></div>`}).join('')||'<p class=note>Skill tidak ditemukan.</p>'}
function pick(i){const a=DB.sk[i][0];if(S.need[a]==i)delete S.need[a];else S.need[a]=i;LAST=null;save();closeSheet();view();const on=S.need[a]==i;sfx(on?'up':'down');toast(on?'Skill ditambahkan':'Skill dihapus')}
function addC(){if(draft.a1<0||!draft.p1)return toast('Pilih skill 1 dulu');S.charms.push({a1:draft.a1,p1:draft.p1,a2:draft.a2,p2:draft.a2>=0?draft.p2:0,s:draft.s});draft={a1:-1,p1:5,a2:-1,p2:0,s:1};LAST=null;save();vCharm();sfx('up');toast('Talisman disimpan')}
function delC(i){openDlg('trash','Hapus talisman?',cs(S.charms[i]),'Hapus',()=>{S.charms.splice(i,1);S.charm='none';LAST=null;save();vCharm();sfx('down')})}
const cab=c=>[[c.a1,c.p1]].concat(c.a2>=0?[[c.a2,c.p2]]:[]);
function solve(nm=S.need,lim=300,tmax=7000){
 const t0=Date.now(),R=Object.keys(nm).map(Number),n=R.length,need=R.map(a=>DB.sk[nm[a]][1]),ri={};
 R.forEach((a,i)=>ri[a]=i);
 const vec=ab=>{const v=Array(n).fill(0);ab.forEach(([a,p])=>{if(a in ri)v[ri[a]]+=p});return v},sum=v=>v.reduce((a,b)=>a+b,0);
 const C=SL.map(part=>{const L=[];
  DB.ar[part].forEach((x,i)=>{if((x[2]&&x[2]!=S.type)||(x[1]&&x[1]!=S.gender)||(S.rank&&x[9]!=S.rank))return;L.push({i,v:vec(x[7]),s:x[4],d:x[5],t:x[8]})});
  L.sort((a,b)=>b.d-a.d);const K=[];
  for(const c of L)if(!K.some(k=>k.s>=c.s&&k.t>=c.t&&k.v.every((p,j)=>p>=c.v[j])))K.push(c);
  return K.sort((a,b)=>lim==1?sum(b.v)-sum(a.v)||b.d-a.d:b.d-a.d||sum(b.v)-sum(a.v))});
 const M=1+C.filter(K=>K.some(c=>c.t)).length;
 const suf=[],ss=[];let acc=Array(n).fill(0),sa=0;
 for(let k=4;k>=0;k--){acc=acc.map((x,j)=>x+Math.max(0,...C[k].map(c=>c.v[j]))*(k==1?M:1));sa+=Math.max(0,...C[k].map(c=>c.s));suf[k]=acc;ss[k]=sa}
 const DK=DB.dec.map((d,i)=>({i,z:d[1],v:vec(d[2])})).filter(d=>d.v.some(p=>p>0));
 const rate=need.map((_,j)=>Math.max(0,...DK.map(d=>d.v[j]/d.z)));
 const byAb=need.map((_,j)=>DK.filter(d=>d.v[j]>0).sort((a,b)=>b.v[j]/b.z-a.v[j]/a.z));
 const Z=Array(n).fill(0),none={i:-1,v:Z,s:0};
 const mk=(c,i)=>({i,v:vec(cab(c)),s:c.s});
 let CH=[none];if(S.charm=='all')CH=CH.concat(S.charms.map(mk));else if(S.charm!='none'&&S.charms[S.charm])CH=[mk(S.charms[S.charm],+S.charm)];
 const out=[],pk=Array(5);let nodes=0,cut=false,fn=0;
 function fill(df,caps,o){
  if(++fn>4000)return false;
  let j=-1,m=0;df.forEach((x,i)=>{if(x>m){m=x;j=i}});if(j<0)return true;
  const u=caps.reduce((a,b)=>a+b,0);
  let ns=0;for(let i=0;i<n;i++)if(df[i]>0){if(!rate[i])return false;ns+=df[i]/rate[i]}if(ns>u+1e-9)return false;
  for(const d of byAb[j]){const tr={};
   for(let b=0;b<caps.length;b++){const c=caps[b];if(c<d.z||tr[c])continue;tr[c]=1;
    caps[b]-=d.z;o.push([d.i,b]);
    if(fill(df.map((x,i)=>x-d.v[i]),caps,o))return true;
    o.pop();caps[b]+=d.z}}
  return false}
 function ok(k,o,bv,sl,ch){
  let ns=0;const av=sl+(ss[k]||0)+ch.s;
  for(let j=0;j<n;j++){let p=o[j]+ch.v[j]+(suf[k]?suf[k][j]:0);if(k>1)p+=bv[j]*M;
   const df=need[j]-p;if(df>0){if(!rate[j])return false;ns+=df/rate[j];if(ns>av+1e-9)return false}}return true}
 function dfs(k,o,bv,sl,ts,ch){
  if(cut)return;
  if(++nodes%2000==0&&Date.now()-t0>tmax){cut=true;return}
  if(k==5){
   const m=1+ts,df=need.map((x,j)=>x-o[j]-ch.v[j]-bv[j]*m),H=[['c',ch.s],['w',S.ws]].concat(pk.map((c,i)=>[i,C[i][c].s])).filter(h=>h[1]>0),caps=H.map(h=>h[1]),ds=[];fn=0;
   if(df.every(x=>x<=0)||fill(df,caps,ds)){out.push({p:pk.map((c,i)=>C[i][c].i),c:ch.i,d:ds.map(x=>[x[0],H[x[1]][0]]),def:pk.reduce((a,c,i)=>a+C[i][c].d,0)});if(out.length>=lim)cut=true}
   return}
  if(!ok(k,o,bv,sl,ch))return;
  C[k].forEach((c,x)=>{pk[k]=x;
   if(k==1)dfs(2,o,c.v,sl+c.s,ts+c.t,ch);else dfs(k+1,o.map((p,j)=>p+c.v[j]),bv,sl+c.s,ts+c.t,ch)})}
 for(const ch of CH)dfs(0,Z,Z,S.ws,0,ch);
 out.sort((a,b)=>b.def-a.def);return{all:out,cut}}
function calc(s){
 if(s.k)return s.k;
 const tot={},add=(ab,m=1)=>ab.forEach(([a,p])=>tot[a]=(tot[a]||0)+p*m),P=s.p.map((i,k)=>DB.ar[SL[k]][i]),mult=1+P.reduce((a,x)=>a+x[8],0);
 P.forEach((x,k)=>add(x[7],k==1?mult:1));if(s.c>=0)add(cab(S.charms[s.c]));s.d.forEach(([i,h])=>add(DB.dec[i][2],h===1?mult:1));
 const dc={};s.d.forEach(([i,h])=>(dc[h]=dc[h]||[]).push(i));
 const act=Object.keys(tot).map(a=>{const T=tot[a];let b=null;
  (ABS[a]||[]).forEach(k=>{if(T>0&&k[1]>0&&k[1]<=T&&(!b||k[1]>b[1]))b=k;if(T<0&&k[1]<0&&T<=k[1]&&(!b||k[1]<b[1]))b=k});return b}).filter(x=>x&&!hid.has(x[2]));
 return s.k={P,dc,mult,act,rs:[0,1,2,3,4].map(r=>P.reduce((a,x)=>a+x[6][r],0))}}
function card(s,n){
 const{P,dc,act,rs,mult}=calc(s),want=new Set(Object.keys(S.need).map(a=>DB.sk[S.need[a]][2]).concat(SEL));
 act.sort((a,b)=>(want.has(b[2])-want.has(a[2]))||(b[1]>0)-(a[1]>0));
 const row=(key,icn,lab,name,tot,ex='')=>{const L=dc[key]||[],u=L.reduce((t,i)=>t+DB.dec[i][1],0);
  return`<div class=pt><span class=ic>${ic(icn)}</span><div><small>${lab}${ex}</small><b>${name}</b>${L.length?`<p class=dl>${ic('gem')}${L.map(i=>DB.dec[i][0]).join(' · ')}</p>`:''}</div>${tot?sdots(tot,u):''}</div>`};
 const ch=s.c>=0?S.charms[s.c]:null;
 return`<article class="sol ${n==1?'best':''}"><div class=sh><span class=rk>${n}</span><div class=def><b>${ic('shield')}${s.def}</b><small>Defense maks</small></div><div class=res>${EL.map((e,i)=>`<span title="${e[1]}"><i style="background:var(--${e[0]})"></i>${rs[i]}</span>`).join('')}</div></div>
<div class=parts>${S.ws?row('w',S.type==1?'sword':'gun','Senjata','Slot senjata',S.ws):''}${P.map((x,k)=>row(k,SL[k],SN[k],x[0],x[4],k==1&&mult>1?` · <em class=tu>skill ×${mult}</em>`:x[8]?' · <em class=tu>Torso Up</em>':'')).join('')}${ch?row('c','charm','Talisman',cs(ch),ch.s):''}</div>
<div class=sec><h4>${ic('skill')}Skill aktif</h4><div class=sk>${act.map(k=>`<span class="${k[1]<0?'neg':want.has(k[2])?'ex':''}">${k[2]}</span>`).join('')}</div></div></article>`}
var SCAN=0;let RA=0,POT=[],PI=0,PN=1,DONE=0,SHOWALL=0;
const LOW=()=>{const m={},bad=S.type==1?3:2;SK.forEach(s=>{if((DB.tg[s.a]||[]).includes(bad))return;if(!m[s.a]||s.p<m[s.a].p)m[s.a]=s});return Object.values(m)};
const NM=()=>{const m=Object.assign({},S.need);SEL.forEach(n=>{const s=SK.find(k=>k.n==n);if(s)m[s.a]=s.i});return m};
function vRes(){
 const r=LAST;$('#cta').innerHTML='';
 $('#app').innerHTML=`<header class=top><button class=icon-btn onclick="back()" aria-label="Kembali">${ic('back')}</button><div><h1>Hasil pencarian</h1><p>${Object.keys(S.need).length} skill · ${['Semua rank','Low','High','G'][S.rank]}${S.rank?' Rank':''} · ${S.type==1?'Blademaster':'Gunner'}</p></div></header><div id=stats></div>
<section class=card><div class=ch><span class=n>${ic('spark')}</span><h3>More Skills</h3><span class=x id=msx></span></div><div id=pot></div></section><div id=res></div>`;
 drawPot();paint()}
function paint(){
 const r=LAST,e=$('#res');if(!r||!e)return;
 if(r.busy){e.innerHTML=`<div class=note><div class=spin></div>Mencari set terbaik…</div>`;$('#stats').innerHTML='';return}
 r.all.forEach(calc);
 setTimeout(()=>RA=0,0);
 $('#stats').innerHTML=`<div class=stats><div class="stat hl"><b>${r.all.length}${r.cut?'+':''}</b><small>set ditemukan</small></div><div class=stat><b>${r.all[0]?r.all[0].def:'–'}</b><small>DEF tertinggi</small></div><div class=stat><b>${SEL.length}</b><small>skill bonus</small></div></div>`;
 e.innerHTML=r.all.length?r.all.slice(0,40).map((s,i)=>(RA?card(s,i+1).replace('<article class="sol','<article style="animation-delay:'+Math.min(i,8)*.06+'s" class="in sol'):card(s,i+1))).join('')+(r.all.length>40?`<p class=note>Menampilkan 40 set dengan DEF tertinggi.</p>`:''):`<p class=note>Tidak ada set yang memenuhi${r.cut?' dalam batas waktu':''}.<br>Coba kurangi skill, ganti rank, atau pakai talisman.</p>`}
function drawPot(){
 const e=$('#pot');if(!e)return;
 const list=SHOWALL?POT:POT.slice(0,14),sel=SEL.filter(n=>!list.includes(n));
 $('#msx').textContent=DONE?POT.length+' rekomendasi':'';
 e.innerHTML=`<p class=empty style="margin-bottom:12px">${DONE?(POT.length?'Skill ini masih bisa ikut didapat. Ketuk untuk menambah.':'Tidak ada skill tambahan yang muat.'):'Mencari skill yang masih muat…'}</p>`+(DONE?'':`<div class=prog><i style="width:${Math.round(PI/PN*100)}%"></i></div>`)+
 `<div class=ms>${sel.concat(list).map(n=>`<button class="${SEL.includes(n)?'on':''}" onclick="tg('${n.replace(/'/g,"\\'")}')"><span class=bx>${SEL.includes(n)?ic('check'):''}</span>${n}</button>`).join('')}</div>`+
 (POT.length>14?`<button class=more onclick="SHOWALL^=1;drawPot()">${ic(SHOWALL?'x':'plus')}${SHOWALL?'Tampilkan lebih sedikit':'Lihat semua ('+POT.length+')'}</button>`:'')+
 (SEL.length?`<button class=more onclick="SEL=[];drawPot();refine()">${ic('x')}Hapus pilihan bonus</button>`:'')}
function scan(){
 const tok=++SCAN,base=NM(),c=LOW().filter(s=>!(s.a in base));let i=0;POT=[];DONE=0;PI=0;PN=c.length||1;drawPot();
 (function step(){if(tok!=SCAN)return;const t=Date.now();
  while(i<c.length&&Date.now()-t<120){const s=c[i++];if(solve(Object.assign({},base,{[s.a]:s.i}),1,120).all.length)POT.push(s.n)}
  PI=i;DONE=i>=c.length;POT.sort();drawPot();if(!DONE)setTimeout(step,0)})()}
function refine(){LAST={busy:1,all:[]};paint();setTimeout(()=>{LAST=solve(NM());paint();sfx('pop');scan()},30)}
function tg(n){const x=SEL.indexOf(n);x<0?SEL.push(n):SEL.splice(x,1);SHOWALL=0;refine();drawPot()}
function run(){
 if(!Object.keys(S.need).length)return;
 SCAN++;SEL=[];SHOWALL=0;POT=[];DONE=0;page='res';LAST={busy:1,all:[]};trans(view);
 setTimeout(()=>{LAST=solve();RA=1;paint();sfx(LAST.all.length?'chime':'down');scan()},260)}
vPick();anim(document.getElementById('app'),'enter',900);
</script></body></html>
